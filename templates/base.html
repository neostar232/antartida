<!doctype html>
  <title>{% block title %}{% endblock %} - Buque Ushuaia</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <!-- Load jQuery if not already loaded. -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
  <!-- Load the TableSorter plugin. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.tablesorter/2.21.5/js/jquery.tablesorter.min.js"></script>
  <!-- Load a theme i.e. "ice". 
  <link href="https://cdnjs.cloudflare.com/ajax/libs/jquery.tablesorter/2.21.5/css/theme.ice.min.css" rel="stylesheet" />
  -->
  <script type="text/javascript" src="{{ url_for('static', filename='js/ot.js') }}"></script>
  <script type="text/javascript" src="{{ url_for('static', filename='js/ps.js') }}"></script>
  <script type="text/javascript" src="{{ url_for('static', filename='js/pop.js') }}"></script>
  
<nav>
  <h1><a href="{{ url_for('auth.redirectlink') }}">Gestión Buque Ushuaia</a></h1>
  <ul>
    {% if g.user %}
      <li><span>{{ g.user['username'] }}</span>
      <li><a href="{{ url_for('auth.logout') }}">Log Out</a>
    {% else %}      
      <li><a href="{{ url_for('auth.login') }}">Log In</a>
    {% endif %}
  </ul>
</nav>
<section class="content">
  <header>
    {% block header %}{% endblock %}
  </header>
  {% for message in get_flashed_messages() %}
    <div class="flash">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</section>
