<!DOCTYPE html>
<html>
<head>
    <title>Registrar Consumo</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Registrar Consumo de Pasajero</h1>
    </header>
    <main>
        <section>
            <form>
                <label for="cabin_id">Seleccionar Cabina:</label>
                <select name="cabin_id" id="cabin_id" hx-get="{{ url_for('consumption.pasajeros_cabina', cabin_id='') }}" hx-target="#lista-pasajeros" hx-trigger="change">
                    <option value="">Seleccione una cabina</option>
                    {% for cabin in cabins %}
                    <option value="{{ cabin.id_cabin }}">{{ cabin.tx_cabin_desc }} ({{ cabin.tx_cabin_type }})</option>
                    {% endfor %}
                </select>
            </form>
        </section>

        <section id="lista-pasajeros">
            </section>

        <section id="lista-categorias">
            </section>

        <section id="lista-productos">
            </section>

        <section>
            <form hx-post="{{ url_for('consumption.registrar_consumo') }}">
                <h3>Productos a Consumir</h3>
                <div id="productos-seleccionados">
                    </div>
                <input type="hidden" name="passenger_id" id="passenger_id_submit">
                <input type="hidden" name="cabin_id" id="cabin_id_submit_consumo">
                <button type="submit">Registrar Consumo</button>
            </form>
        </section>

        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        <div class="flashes">
            {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
    </main>
</body>
</html>
