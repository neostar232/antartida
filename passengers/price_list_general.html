<!DOCTYPE html>
<html>
<head>
    <title>Lista de Precios</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap');
        body {
            font-family: 'Ubuntu', Arial, sans-serif;
            margin: 15mm; 
            padding: 0;
        }
        h1 {
            color: #333;
            margin: 0; 
            padding-bottom: 10px; 
            page-break-after: avoid !important;
            font-weight: 700;
        }
        .price-list-group {
            margin-top: 0; 
            margin-bottom: 25px;
            page-break-inside: avoid;
            page-break-before: avoid !important; /* Solución para el salto persistente ? */
        }
        .group-title {
            background-color: #f0f0f0;
            padding: 8px 10px;
            font-weight: bold;
            font-size: 1.2em;
            border-bottom: 2px solid #ccc;
            margin-top: 0; 
            page-break-after: avoid;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 5px;
            table-layout: fixed;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 5px 3px;
            text-align: left;
            font-size: 0.95em;
        }
        th {
            background-color: #e8e8e8;
            color: #333;
        }
        .price-list-group table td:first-child {
            width: 87%;
        }
        .price-column {
            text-align: right;
            width: 13%; 
            font-weight: bold;
        }
        
        .group-separator {
            border: none; 
            border-top: 1px dashed #aaa; 
            margin: 20px 0;
        }
    </style>
</head>
<body>

    
    
    {% for group in grouped_lists %}
    <div class="price-list-group">
        
        <h2 class="group-title">{{ group.name }}</h2>

        <table>
            <thead>
                <tr>
                    <th>Producto / Servicio</th>
                    <th class="price-column">Precio (USD)</th>
                </tr>
            </thead>
            <tbody>
                {% for prod in group.products %}
                <tr>
                    <td>{{ prod.producto }}</td>
                    <td class="price-column">${{ "{:,.2f}".format(prod.nu_price_usd) }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    {% if not loop.last %}

    {% endif %}

    {% endfor %}

</body>
</html>
