<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Precios</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos generales para WeasyPrint */
        @page {
            size: A4;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Lato', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f8f8;
            color: #333;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            margin: auto;
            background: white;
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: left;
            padding: 40px 0;
            border-bottom: 2px solid #2c3e50;
        }
        
        .header img {
            width: 80px;
            height: auto;
            margin-left: 170px;
        }
        
        .header-text {
            text-align: left;
        }
        
        .header-text h1 {
            color: #2c3e50;
            font-family: 'Poppins', sans-serif;
            font-size: 2.2em;
            margin: 0;
            font-weight: 600;
        }
        
        .header-text p {
            color: #1abc9c;
            font-family: 'Poppins', sans-serif;
            font-size: 1.2em;
            margin: 5px 0 0;
            font-weight: 300;
        }
        
        .section {
            position: relative;
            padding: 40px;
            overflow: hidden;
            border-bottom: 1px solid #ddd;
            border-left: 5px solid #1abc9c;
        }
        
        .section-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.08;
        }
        
        /* Fondo con un toque de color */
        .cuerpo .section-bg {
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%231abc9c' fill-opacity='0.2'%3E%3Cpath d='M25 0h50v100H25z'/%3E%3C/g%3E%3C/svg%3E");
        }
        
        
        .section-content {
            position: relative;
            z-index: 2;
        }
        
        
        h2 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.5em;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        
        h3 {
            font-family: 'Poppins', sans-serif;
            font-size: 1.1em;
            color: #2c3e50;
            margin-top: 20px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }
        
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        
        
        th, td {
            padding: 12px 0;
            text-align: left;
        }
        
        
        th {
            font-weight: 600;
            color: #2c3e50;
            padding-bottom: 5px;
        }
        
        
        tr {
            border-bottom: 1px solid #eee;
        }
        
        
        tr:last-child {
            border-bottom: none;
        }
        
        
        td:last-child {
            text-align: right;
            font-weight: 600;
            color: #1abc9c;
        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="{{ url_for('static', filename='buquex.png') }}" alt="Logo de Buque Ushuaia">
            <div class="header-text">
                <h1>Buque Ushuaia</h1>
                <p>Price List</p>
            </div>
        </div>
        <div class="section cuerpo">
            <div class="section-bg"></div>
            <div class="section-content">
                <h2>{{ cat_name }}</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for item in prods %}
                        <tr>
                            <td>{{ item.producto }}</td>
                            <td>${{ "%.2f"|format(item.nu_price_usd) }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
